[package]
name = "midi_counter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A VST3 plugin that counts every MIDI note you play"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
baseview = { version = "0.4.2", features = ["opengl"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
femtovg = { version = "0.28", default-features = false, features = ["textlayout"] }
keyboard-types = "0.8.3"
raw-window-handle = "0.6.2"
rtrb = "0.4"
vst3 = "0.3"


[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
