# Builds and tests the plugin on every push and pull request, and uploads
# "MIDI Counter.vst3" as a downloadable artifact of the run.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # 22.04 (glibc 2.35) so the plugin also loads on distros older than the newest runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build the VST3 bundle
        run: ./scripts/bundle.sh

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Counter-vst3-linux-${{ github.sha }}
          path: target/bundle/
          if-no-files-found: error
